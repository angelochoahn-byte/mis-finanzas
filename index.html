<style>

<main class="wrap">

  <div id="v-gastos" hidden></div>

  <button data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Gastos</button>

<script>
"use strict";
// ================= utilidades =================
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pad = n => String(n).padStart(2,"0");
const hoyISO = () => {const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const mesDe = iso => iso ? iso.slice(0,7) : "";
const mesHoy = () => mesDe(hoyISO());
const mesNombre = (ym, siempreAnio) => {const [y,m]=ym.split("-").map(Number);return MESES[m-1]+(siempreAnio||y!==new Date().getFullYear()?" "+y:"")};
const sumaMes = (ym,n) => {let [y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m)};
const L = (n, dec) => { const v = Math.round((+n||0)*100)/100; const neg=v<0;
  return (neg?"−":"")+"L"+Math.abs(v).toLocaleString("es-HN",{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0}); };
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const diaLargo = iso => new Date(iso+"T12:00:00").toLocaleDateString("es-HN",{weekday:"long",day:"numeric",month:"long"});
const diaCorto = iso => {const [,m,d]=iso.split("-").map(Number);return d+" "+MESES[m-1].slice(0,3)};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function heroNum(v){return `<div class="big num ${v<0?"bad":""}">${v<0?"−":""}<small>L</small>${Math.abs(Math.round(v)).toLocaleString("es-HN")}</div>`}

// ================= estado =================
let db = null;
const S = { gastos:new Map(), fondos:new Map(), aportes:new Map(), config:{}, plan:{} };
let tab = "inicio", mesVer = mesHoy(), mesGastos = mesHoy();

const DEF_TARJETAS = [{id:"Débito",tipo:"debito"},{id:"Efectivo",tipo:"debito"},{id:"Economía",tipo:"credito",corte:12},{id:"Ficohsa",tipo:"credito",corte:12},{id:"Conecta",tipo:"credito",corte:18},{id:"Promerica",tipo:"credito",corte:10},{id:"Davivienda",tipo:"credito",corte:5}];
const tarjetas = () => S.config.tarjetas || DEF_TARJETAS;
const tarjeta = id => tarjetas().find(t=>t.id===id) || {id,tipo:"debito"};
const esDebito = id => tarjeta(id).tipo!=="credito";
const presu = () => S.plan.presupuesto || {};
const categorias = () => presu().categorias || [];
const cat = n => categorias().find(c=>c.nombre===n);
const grupoDe = g => (cat(g.categoria)||{}).grupo || g.grupo || "";
const esVariable = g => !["fijos","ahorro"].includes(grupoDe(g));
const tramos = () => S.plan.tramos || [];
const inicioPresu = () => presu().inicio || "2027-01";
const MES_MIN = "2026-11", MES_MAX = "2027-12";

// Cuándo se paga: Angel paga todas las tarjetas el día 1 del mes siguiente al corte.
function pagoMes(fecha, tId){
  const t = tarjeta(tId);
  if (t.tipo!=="credito" || !t.corte || !fecha) return null;
  const [y,m,d] = fecha.split("-").map(Number);
  let ym = y+"-"+pad(m); if (d > t.corte) ym = sumaMes(ym,1);
  return sumaMes(ym,1);
}
function pagoTexto(fecha,tId){const p=pagoMes(fecha,tId);return p?"se paga el 1 de "+mesNombre(p):"pagado al momento"}

// Gastos que cuentan: los del estado de cuenta + lo anotado que aún no se cuadró.
const vigentes = () => [...S.gastos.values()].filter(g=>!g.cuadrado && !g.reembolsaSeguro);
const mesGasto = g => g.mes || mesDe(g.fecha);

// ---------- modo plan (nov–dic 2026): lo disponible por tramo ----------
const tramosDelMes = ym => tramos().filter(t=>mesDe(t.desde)===ym || mesDe(t.hasta)===ym);
const esMesPlan = ym => ym < inicioPresu() && tramosDelMes(ym).length>0;
function gastosTramo(t){return vigentes().filter(g=>g.fecha && g.fecha>=t.desde && g.fecha<=t.hasta && esVariable(g) && ((t.medio==="debito")===esDebito(g.tarjeta)))}
const gastadoTramo = t => gastosTramo(t).reduce((a,g)=>a+(+g.montoL||0),0);
function tramoActual(ym){const h=hoyISO(), ts=tramosDelMes(ym);return ts.find(t=>t.desde<=h&&h<=t.hasta) || ts.find(t=>t.desde>h) || ts[ts.length-1]}

// ---------- modo presupuesto (desde enero 2027) ----------
// Fijos esperados del mes (cuotas que se van terminando, mesada, servicios…) + compras con tarjeta de nov–dic que se pagan ese mes.
function fijosDelMes(ym){
  const items = (S.plan.fijos||[]).filter(f=>(!f.desde||f.desde<=ym)&&(!f.hasta||ym<=f.hasta)).map(f=>({...f}));
  const arr = vigentes().filter(g=>mesGasto(g)<inicioPresu() && tarjeta(g.tarjeta).tipo==="credito" && esVariable(g) && pagoMes(g.fecha,g.tarjeta)===ym);
  const s = arr.reduce((a,g)=>a+(+g.montoL||0),0);
  if (s>0) items.push({nombre:"Compras con tarjeta de "+[...new Set(arr.map(g=>MESES[+mesGasto(g).slice(5)-1].slice(0,3)))].join(" y "),montoL:s,detalle:arr});
  return items;
}
const memo = {};
function presupuestoMes(ym){
  const key = ym; if (memo[key]) return memo[key];
  const P = presu(), sueldo = +S.config.sueldo || 0;
  const fijos = fijosDelMes(ym), F = fijos.reduce((a,f)=>a+f.montoL,0);
  const varCats = categorias().filter(c=>c.grupo==="necesarios"||c.grupo==="estilo");
  const V = varCats.reduce((a,c)=>a+c.monto,0);
  const ahorro = (P.ahorro||[]).map(a=>({...a}));
  const A = ahorro.filter(a=>!a.resto).reduce((a,x)=>a+x.monto,0);
  const R = sueldo - F - V - A;
  const tope = P.imprevistos || 2250;
  const impr = R - tope < 100 ? R : tope;   // si sobra muy poco, se queda en imprevistos
  ahorro.forEach(a=>{if(a.resto)a.monto=Math.max(0,R-impr)});
  const montos = {}; varCats.forEach(c=>montos[c.nombre]=c.monto); montos["Imprevistos"]=impr;
  return memo[key] = {sueldo,fijos,F,montos,ahorro,Ahorro:ahorro.reduce((a,x)=>a+x.monto,0),gastar:V+impr};
}
function gastadoCat(ym){const o={};vigentes().forEach(g=>{if(mesGasto(g)===ym&&esVariable(g))o[g.categoria]=(o[g.categoria]||0)+(+g.montoL||0)});return o}
// Disponible por categoría; lo que te pasaste el mes anterior se descuenta este mes.
function disponible(ym){
  if (memo["d"+ym]) return memo["d"+ym];
  const p = presupuestoMes(ym), g = gastadoCat(ym), out = {};
  const prev = ym>inicioPresu() ? disponible(sumaMes(ym,-1)) : null;
  const nombres = new Set([...Object.keys(p.montos), ...Object.keys(g)]);
  nombres.forEach(n=>{
    const monto = p.montos[n] ?? 0;
    let arrastre = prev && prev[n] ? Math.min(0, prev[n].queda) : 0;
    if (!prev && n==="Imprevistos") arrastre = tramosDelMes(sumaMes(ym,-1)).reduce((a,t)=>a+Math.min(0,t.limite-gastadoTramo(t)),0);
    out[n] = {monto, gastado:g[n]||0, arrastre, queda: monto + arrastre - (g[n]||0)};
  });
  return memo["d"+ym] = out;
}
function limpiarMemo(){Object.keys(memo).forEach(k=>delete memo[k])}

function barra(gast, total){const p=total>0?gast/total:(gast>0?1.01:0);return {pct:Math.max(0,Math.min(100,p*100)),cls:p>1?"bad":p>.85?"warn":""}}

function renderInicio(){
  const ym = mesVer;
  $("#hMes").textContent = mesNombre(ym, true);
  $("#mPrev").disabled = ym<=MES_MIN; $("#mNext").disabled = ym>=MES_MAX;
  if (!S.plan.presupuesto){$("#hero").innerHTML="";$("#v-inicio").innerHTML='<div class="card empty">Todavía no hay presupuesto cargado.</div>';return}
  if (esMesPlan(ym)) return renderPlan(ym);
  if (ym >= inicioPresu()) return renderPresupuesto(ym);
  $("#hero").innerHTML = `<div class="bigsub" style="margin-top:14px">Este mes no tiene plan ni presupuesto.</div>`;

}

function renderPlan(ym){
  const ts = tramosDelMes(ym), act = tramoActual(ym), h = hoyISO();
  const q = act.limite - gastadoTramo(act);
  const enCurso = act.desde<=h && h<=act.hasta;
  $("#hero").innerHTML = heroNum(q) + `<div class="bigsub">${q<0?"te pasaste del límite":"disponible para gastar"} · ${esc(act.nombre.toLowerCase())}${enCurso?"":(act.desde>h?" (aún no empieza)":" (terminó)")}</div>`;
  let html = `<section>`;
  ts.forEach(t=>{
    const g = gastadoTramo(t), r = t.limite-g, b = barra(g,t.limite);
    const estado = h>t.hasta ? '<span class="pill gray">terminó</span>' : (h>=t.desde ? '<span class="pill">ahora</span>' : '<span class="pill gray">próximo</span>');
    html += `<button class="card tramo ${t===act&&h<=t.hasta?"now":""} ${h>t.hasta?"done":""}" data-tramo="${esc(t.id)}">
      <div class="lbl">${esc(t.nombre)} ${estado}</div>
      <div class="row"><div class="amt num ${r<0?"bad-t":""}">${r<0?"te pasaste "+L(-r):L(r)}</div><div class="sub num">de ${L(t.limite)}</div></div>
      <div class="bar ${b.cls}"><i style="width:${b.pct}%"></i></div>
      <div class="rule">${esc(t.regla||"")}</div></button>`;
  });
  html += `</section>`;
  // En qué se fue (tramo seleccionado)
  const gs = gastosTramo(act), porCat = {};
  gs.forEach(g=>porCat[g.categoria]=(porCat[g.categoria]||0)+(+g.montoL||0));
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  html += `<section><h2>En qué se fue <span class="num">${L(gastadoTramo(act))}</span></h2><div class="card">`;
  html += cats.length ? cats.map(([n,v])=>`<button class="cat" data-cat="${esc(n)}" data-tr="${esc(act.id)}"><div class="row"><span class="name">${esc(n)}</span><span class="left num">${L(v)}</span></div></button>`).join("") : `<div class="empty">Sin gastos en este tramo todavía.</div>`;
  html += `</div><div class="sub" style="margin:0 6px">${act.medio==="debito"?"Cuenta solo lo pagado con débito o efectivo.":"Cuenta solo lo pagado con tarjeta de crédito."} Los fijos no entran aquí.</div></section>`;
  $("#v-inicio").innerHTML = html;
  $$("#v-inicio [data-cat]").forEach(b=>b.onclick=()=>{const t=tramos().find(x=>x.id===b.dataset.tr);verLista(b.dataset.cat, gastosTramo(t).filter(g=>g.categoria===b.dataset.cat), esc(t.nombre))});
  $$("#v-inicio [data-tramo]").forEach(b=>b.onclick=()=>{const t=tramos().find(x=>x.id===b.dataset.tramo);verLista(t.nombre, gastosTramo(t), t.medio==="debito"?"Pagado con débito o efectivo":"Pagado con tarjeta")});
}

function filaGasto(g){
  const off = g.cuadrado || g.reembolsaSeguro;
  const tag = g.origen==="app" ? (g.cuadrado?'<span class="tag gray">ya en el estado</span>':'<span class="tag">anotado</span>') : (g.reembolsaSeguro?'<span class="tag gray">reembolsa seguro</span>':"");
  return `<button class="item" data-id="${esc(g._id)}" style="${off?"opacity:.55":""}"><div class="txt"><div>${esc(g.comercio||g.categoria)}${tag}</div><div class="meta">${g.fecha?diaCorto(g.fecha)+" · ":""}${esc(g.tarjeta)} · ${pagoTexto(g.fecha,g.tarjeta)}</div></div><div class="amt num">${g.moneda==="USD"?"$"+(+g.monto).toFixed(2):L(g.montoL,true)}</div></button>`;
}
function verLista(titulo, lista, sub){
  lista = [...lista].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));

    ${lista.length?`<div class="card list">${lista.map(filaGasto).join("")}</div>`:`<div class="card empty">No hay gastos.</div>`}`);

}

function saldoFondo(f){return (+f.saldoInicial||0) + [...S.aportes.values()].filter(a=>a.fondo===f._id).reduce((s,a)=>s+(+a.monto||0),0)}
const FCOL = ["var(--f1)","var(--f2)","var(--f3)","var(--f4)","var(--f5)"];
function donut(parts){
  const tot = parts.reduce((a,p)=>a+p.v,0);
  let off=25, segs="";
  if (tot>0) parts.forEach(p=>{const pct=p.v/tot*100; if(pct<=0)return; segs+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${off}"/>`; off-=pct;});
  return `<svg width="116" height="116" viewBox="0 0 42 42" role="img" aria-label="Dónde está tu ahorro" style="flex:none"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--track)" stroke-width="6"/>${segs}</svg>`;
}
function renderAhorro(){

  const tot = fs.reduce((a,f)=>a+saldoFondo(f),0);
  $("#hero").innerHTML = heroNum(tot) + `<div class="bigsub">ahorrado en total</div>`;
  const donde = {}; fs.forEach(f=>{const k=f.donde||"Sin definir";donde[k]=(donde[k]||0)+saldoFondo(f)});

      ${meta?`<div class="bar"><i style="width:${e}%"></i></div><div class="row sub num" style="margin-top:8px"><span>${Math.floor(e)}% de ${L(meta)}</span><span>faltan ${L(Math.max(0,meta-s))}</span></div>`:""}
      <div class="sub" style="margin-top:8px">${esc(f.donde||"Sin definir")}${f.aporteMensual?` · aporte ${L(f.aporteMensual)}/mes`:""}${f.nota?` · ${esc(f.nota)}`:""}</div>
      <div class="row" style="margin-top:8px;justify-content:flex-start;gap:20px"><button class="btn ghost" data-ap="${esc(f._id)}" data-sign="1">+ Aportar</button><button class="btn ghost" data-ap="${esc(f._id)}" data-sign="-1" style="color:var(--muted)">− Retirar</button></div></div>`;});
  if(!fs.length) h += `<div class="card empty">Todavía no hay fondos.</div>`;

  $$("#v-ahorro [data-ap]").forEach(b=>b.onclick=()=>abrirAporte(b.dataset.ap,+b.dataset.sign));
}

// ================= hojas deslizables =================
// Desliza hacia abajo para cerrar; hacia arriba para verla completa.
function hoja(html){
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grabzone"><div class="grab"></div></div>${html}</div>`;
  const sh=sc.firstElementChild;
  sc.cerrar=()=>{sh.classList.remove("open");sh.style.transform="";sc.style.background="transparent";setTimeout(()=>{sc.remove();if(!$(".scrim"))document.body.classList.remove("locked")},260)};
  sc.addEventListener("click",e=>{if(e.target===sc)sc.cerrar()});
  let y0=null,dy=0,desdeArriba=false,t0=0;
  sh.addEventListener("touchstart",e=>{const enGrab=e.target.closest(".grabzone");if(!enGrab&&sh.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0;t0=Date.now();desdeArriba=!!enGrab;},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(dy>0&&(desdeArriba||sh.scrollTop<=0)){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener("touchend",()=>{if(y0===null)return;sh.classList.remove("drag");const v=dy/Math.max(1,Date.now()-t0);
    if(dy>110||(dy>40&&v>.5))sc.cerrar();else{sh.style.transform="";if(dy<-40)sh.classList.add("full")}y0=null});
  document.body.appendChild(sc);document.body.classList.add("locked");
  requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add("open")));
  return sc;
}
function matchCat(s){if(!s)return null;const n=norm(s);return (categorias().find(c=>norm(c.nombre)===n)||categorias().find(c=>norm(c.nombre).startsWith(n))||categorias().find(c=>norm(c.nombre).includes(n))||{}).nombre||null}
function matchTarj(s){if(!s)return null;const n=norm(s);return (tarjetas().find(t=>norm(t.id)===n)||tarjetas().find(t=>norm(t.id).startsWith(n))||{}).id||null}
function tarjetaDefault(){const ym=mesHoy();if(esMesPlan(ym)){const t=tramoActual(ym);return t&&t.medio==="tarjeta"?"Economía":"Débito"}return "Débito"}

// Qué pasaría con este gasto (para "¿Lo compro?" y al anotar)
function analizar(m, categoria, tarj, fecha, editando){
  const c = cat(categoria), ym = mesDe(fecha), fijo = c && (c.grupo==="fijos"||c.grupo==="ahorro");
  const out = {lineas:[], cls:"ok", tit:"Sí te alcanza"};
  const pago = pagoTexto(fecha,tarj);
  const resta = editando && esVariable(editando) ? (+editando.montoL||0) : 0;
  if (fijo){ out.tit="Es un gasto fijo"; out.lineas.push("Los fijos ya están apartados de tu sueldo."); }
  else if (esMesPlan(ym)){
    const t = tramosDelMes(ym).find(x=>x.desde<=fecha&&fecha<=x.hasta);
    if (t){ const deb=esDebito(tarj), cuenta=(t.medio==="debito")===deb;
      if (cuenta){ const q=t.limite-gastadoTramo(t)+resta-m; out.lineas.push(`${t.nombre}: te quedarían <b class="num">${L(q)}</b>`); if(q<0){out.cls="no";out.tit="No te alcanza"} else if(q<t.limite*.1){out.cls="meh";out.tit="Te alcanza, pero justo"} }
      else { out.cls="meh"; out.tit="Ojo con la forma de pago"; out.lineas.push(`Tu plan para ${t.nombre.toLowerCase()} es ${t.medio==="debito"?"pagar con débito":"pagar con tarjeta"}.`); }
    } else out.lineas.push("No hay un tramo del plan para esta fecha.");
  } else if (ym >= inicioPresu()){
    const d = disponible(ym), x = d[categoria] || {queda:0};
    const qc = x.queda + resta - m;
    const vars = Object.values(d).reduce((a,v)=>a+v.queda,0) + resta - m;
    out.lineas.push(`En ${esc(categoria)} te ${qc<0?"pasarías por <b class='num'>"+L(-qc)+"</b>":"quedarían <b class='num'>"+L(qc)+"</b>"}`);
    out.lineas.push(`Para todo el mes te quedarían <span class="num">${L(vars)}</span>`);
    if(qc<0){out.cls=vars<0?"no":"meh";out.tit=vars<0?"No te alcanza":"Te pasas en "+categoria} else if(qc<(x.monto||0)*.15){out.cls="meh";out.tit="Te alcanza, pero justo"}
    if(qc<0&&vars>=0)out.lineas.push("Lo que te pases se descuenta de esta categoría el próximo mes.");
  }
  out.lineas.push(pago[0].toUpperCase()+pago.slice(1));
  return out;
}

function abrirForm(o){
  const compro = o.modo==="compro", edit = o.id ? {...S.gastos.get(o.id)} : null;
  const st = { moneda: edit?edit.moneda:(o.moneda==="USD"?"USD":"HNL"), categoria: edit?edit.categoria:matchCat(o.cat),
    tarjeta: edit?edit.tarjeta:(matchTarj(o.tarjeta)||tarjetaDefault()) };
  const vs = categorias().filter(c=>c.grupo!=="fijos"&&c.grupo!=="ahorro"), fj = categorias().filter(c=>c.grupo==="fijos");
  const chipsCat = list => list.map(c=>`<button type="button" data-c="${esc(c.nombre)}" aria-pressed="${st.categoria===c.nombre}">${esc(c.nombre)}</button>`).join("");
  const sc = hoja(`<div class="head"><h1>${compro?"¿Lo compro?":edit?"Editar gasto":"Anotar gasto"}</h1>${compro?'<div class="sub">Revisa si te alcanza antes de comprar.</div>':""}</div>
    <div class="field amount"><input id="fMonto" inputmode="decimal" placeholder="0" value="${esc(edit?edit.monto:(o.monto||""))}" aria-label="Monto" autocomplete="off">
      <div class="seg" role="group" aria-label="Moneda"><button type="button" data-m="HNL" aria-pressed="${st.moneda==="HNL"}">L</button><button type="button" data-m="USD" aria-pressed="${st.moneda==="USD"}">$</button></div></div>
    <div id="fRes"></div>
    <div class="field"><div class="chiplabel">Categoría</div><div class="chips">${chipsCat(vs)}</div>
      <details style="margin-top:10px"${st.categoria&&fj.some(c=>c.nombre===st.categoria)?" open":""}><summary class="sub" style="padding:6px 0">Fijos ›</summary><div class="chips" style="margin-top:8px">${chipsCat(fj)}</div></details></div>
    <div class="field"><div class="chiplabel">¿Con qué pagas?</div><div class="chips">${tarjetas().map(t=>`<button type="button" data-t="${esc(t.id)}" aria-pressed="${st.tarjeta===t.id}">${esc(t.id)}</button>`).join("")}</div></div>
    ${compro?"":`<label>Comercio o nota<input type="text" id="fCom" value="${esc(edit?edit.comercio:(o.nota||""))}" placeholder="Ej. Walmart, gasolina…" autocomplete="off"></label>
    <label>Fecha<input type="date" id="fFecha" value="${esc(edit?edit.fecha:hoyISO())}"></label>`}
    <button class="primary" id="fSave">${compro?"Lo compré, anotarlo":edit?"Guardar cambios":"Guardar"}</button>
    ${edit?`<button class="btn danger wide" style="margin-top:12px" id="fDel">Borrar gasto</button>`:""}`);
  const inp = $("#fMonto",sc), tasa = +S.config.tasa || 27;
  const valor = () => parseFloat(String(inp.value).replace(/,/g,""))||0;
  const montoL = () => st.moneda==="USD"?valor()*tasa:valor();
  const fecha = () => compro ? hoyISO() : ($("#fFecha",sc).value||hoyISO());
  function res(){
    const box=$("#fRes",sc), m=montoL();
    if(!m||!st.categoria){box.innerHTML=compro?`<div class="sub" style="margin:-6px 0 18px">Pon el monto y la categoría.</div>`:"";return}
    limpiarMemo();
    const r = analizar(m, st.categoria, st.tarjeta, fecha(), edit);
    if(!compro&&r.cls==="ok"&&r.tit==="Sí te alcanza")r.tit="Dentro de lo planeado";
    box.innerHTML=`<div class="verdict ${r.cls}"><b>${r.tit}</b><ul>${r.lineas.map(l=>`<li>${l}</li>`).join("")}${st.moneda==="USD"?`<li class="num">Equivale a ${L(m)}</li>`:""}</ul></div>`;
  }
  inp.addEventListener("input",res);
  const f=$("#fFecha",sc); if(f) f.addEventListener("change",res);
  const grupoBtn=(attr,key)=>$$(`[${attr}]`,sc).forEach(b=>b.onclick=()=>{st[key]=b.getAttribute(attr);$$(`[${attr}]`,sc).forEach(x=>x.setAttribute("aria-pressed",x===b));res()});
  grupoBtn("data-m","moneda");grupoBtn("data-c","categoria");grupoBtn("data-t","tarjeta");
  if(edit) $("#fDel",sc).onclick=async()=>{if(!confirm("¿Borrar este gasto?"))return;try{await db.collection("gastos").doc(o.id).delete();sc.cerrar();toast("Gasto borrado")}catch(e){alert("No se pudo borrar: "+e.message)}};
  $("#fSave",sc).onclick=async()=>{
    const v=valor();
    if(!(v>0)){inp.focus();toast("Pon el monto");return}
    if(!st.categoria){toast("Elige la categoría");return}
    const c=cat(st.categoria);
    const data={fecha:fecha(),comercio:compro?"":$("#fCom",sc).value.trim(),monto:v,moneda:st.moneda,
      montoL:Math.round(montoL()*100)/100,categoria:st.categoria,grupo:c?c.grupo:"",tarjeta:st.tarjeta,origen:edit?edit.origen:"app"};
    const btn=$("#fSave",sc);btn.disabled=true;
    try{
      const {_id,...resto}=edit||{};
      if(edit) await db.collection("gastos").doc(o.id).set({...resto,...data});
      else await db.collection("gastos").add({...data,creado:new Date().toISOString()});
      sc.cerrar();toast(edit?"Cambios guardados":"Gasto anotado");
    }catch(e){btn.disabled=false;alert("No se pudo guardar: "+e.message)}
  };
  res(); if(!edit) setTimeout(()=>inp.focus(),300);
}

function verGasto(id){
  const g=S.gastos.get(id); if(!g) return;
  if(g.origen==="app" && !g.cuadrado) return abrirForm({modo:"anotar",id});
  hoja(`<div class="head"><h1>${esc(g.comercio||g.categoria)}</h1></div><div class="card">
    <div class="line"><span class="sub">Monto</span><b class="num">${g.moneda==="USD"?"$"+(+g.monto).toFixed(2)+" · "+L(g.montoL,true):L(g.montoL,true)}</b></div>
    <div class="line"><span class="sub">Categoría</span><span>${esc(g.categoria)}</span></div>
    <div class="line"><span class="sub">Pago</span><span style="text-align:right">${esc(g.tarjeta)} · ${pagoTexto(g.fecha,g.tarjeta)}</span></div>
    <div class="line"><span class="sub">Fecha</span><span>${g.fecha?diaLargo(g.fecha):"Por confirmar"}</span></div>
    ${g.notas?`<div class="line"><span class="sub">${esc(g.notas)}</span></div>`:""}</div>
    <div class="sub" style="margin:4px 6px 0">${g.cuadrado?"Lo anotaste tú y ya quedó cuadrado con el estado de cuenta, así que no se cuenta dos veces.":"Viene del estado de cuenta. Si algo está mal, avísale a Claude en el proyecto."}</div>`);
}

function abrirAporte(fid,sign){
  const f=S.fondos.get(fid);
  const sc=hoja(`<div class="head"><h1>${sign>0?"Aportar a":"Retirar de"} ${esc(f.nombre)}</h1></div>
    <div class="field"><input id="aM" inputmode="decimal" placeholder="0" aria-label="Monto" style="font-size:30px;font-weight:700" value="${sign>0&&f.aporteMensual?f.aporteMensual:""}"></div>
    <label>Nota (opcional)<input type="text" id="aN" placeholder="${sign>0?"Ej. aporte de enero":"Ej. reparación del carro"}"></label>
    <button class="primary" id="aS">Guardar</button>`);
  $("#aS",sc).onclick=async()=>{const v=parseFloat(String($("#aM",sc).value).replace(/,/g,""));if(!(v>0)){toast("Pon el monto");return}
    try{await db.collection("aportes").add({fondo:fid,monto:sign*v,fecha:hoyISO(),nota:$("#aN",sc).value.trim(),creado:new Date().toISOString()});sc.cerrar();toast("Listo")}catch(e){alert("No se pudo guardar: "+e.message)}};
  setTimeout(()=>$("#aM",sc).select(),300);
}

function go(t){tab=t;render();window.scrollTo(0,0)}
$$("nav.tabs [data-tab]").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="gastos")mesGastos=mesHoy();if(b.dataset.tab==="inicio"&&tab==="inicio")mesVer=mesHoy();go(b.dataset.tab)});
$("#addBtn").onclick=()=>abrirForm({modo:"anotar"});
$("#compBtn").onclick=()=>abrirForm({modo:"compro"});
$("#mPrev").onclick=()=>{if(mesVer>MES_MIN){mesVer=sumaMes(mesVer,-1);render()}};
$("#mNext").onclick=()=>{if(mesVer<MES_MAX){mesVer=sumaMes(mesVer,1);render()}};
// deslizar de lado en el inicio cambia de mes
(()=>{let x0=null,y0=0;const el=$("#v-inicio");
  el.addEventListener("touchstart",e=>{if($(".scrim"))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){(dx<0?$("#mNext"):$("#mPrev")).click()}},{passive:true});})();
$("#menuBtn").onclick=()=>{const sc=hoja(`<div class="head"><h1>Opciones</h1><div class="sub">Sesión: ${esc(FinDB.email()||"")}</div></div>
  <button class="btn wide" id="oR">Actualizar datos</button><button class="btn danger wide" style="margin-top:12px" id="oS">Cerrar sesión</button>`);
  $("#oR",sc).onclick=()=>location.reload();$("#oS",sc).onclick=()=>FinDB.salir()};

// ================= arranque =================
// Atajos de Apple: ?anotar=1&monto=150&cat=Comida&tarjeta=Debito&nota=Baleadas  ·  ?compro=1&monto=800&cat=Ropa
function leerAtajo(){
  const p=new URLSearchParams(location.search);
  const modo=p.has("compro")?"compro":p.has("anotar")?"anotar":null;
  if(!modo) return;
  history.replaceState(null,"",location.pathname);
  abrirForm({modo,monto:p.get("monto")||"",cat:p.get("cat"),tarjeta:p.get("tarjeta"),nota:p.get("nota")||"",moneda:(p.get("moneda")||"").toUpperCase()});
}
(async()=>{
  try{ db = await FinDB.conectar(); }
  catch(e){ $("#v-inicio").innerHTML=`<div class="card empty">No se pudo conectar: ${esc(e.message)}<br><br><button class="primary" onclick="location.reload()">Reintentar</button></div>`; return; }
  let listos=0, atajo=false, pend=null; const total=5;
  const ready=()=>{listos++;cancelAnimationFrame(pend);pend=requestAnimationFrame(()=>{render(); if(listos>=total&&!atajo){atajo=true;leerAtajo()}})};
  const mapCol=(name,map)=>db.collection(name).onSnapshot(s=>{map.clear();s.docs.forEach(d=>map.set(d.id,{...d.data(),_id:d.id}));ready()});
  mapCol("gastos",S.gastos); mapCol("fondos",S.fondos); mapCol("aportes",S.aportes);
  db.doc("config/general").onSnapshot(d=>{S.config=d.exists?d.data():{};ready()});
  db.doc("config/plan").onSnapshot(d=>{S.plan=d.exists?d.data():{};ready()});
})();
</script>
